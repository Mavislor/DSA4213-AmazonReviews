
# Baseline Models Configuration
# Configuration for traditional machine learning models

# Project Settings
project:
  name: "amazon-sentiment-analysis"
  random_seed: 4213
  test_size: 0.15
  val_size: 0.15

# Data Settings
data:
  paths:
    train: "data/processed/train.csv"
    validation: "data/processed/validation.csv"
    test: "data/processed/test.csv"
  features:
    text_column: "review"
    label_column: "label"
  preprocessing:
    sample_size: 20000

# TF-IDF Vectorizer Configuration
tfidf:
  max_features: 10000
  min_df: 5
  max_df: 0.7
  ngram_range: [1, 2]
  stop_words: "english"
  sublinear_tf: true
  lowercase: true
  strip_accents: "unicode"

# Naive Bayes Model Configuration
naive_bayes:
  alpha: 1.0
  fit_prior: true
  class_prior: null

# Logistic Regression Model Configuration
logistic_regression:
  random_state: 4213
  max_iter: 1000
  C: 1.0
  solver: "liblinear"
  penalty: "l2"
  class_weight: "balanced"

# Output Settings
output:
  models_dir: "models/"
  results_dir: "results/"
  metrics_file: "results/metrics/baseline_model_comparison.csv"
